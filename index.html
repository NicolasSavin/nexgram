<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#17212b" />
  <title>Радар</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <button class="icon-btn" id="menuBtn" aria-label="Меню"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></button>
        <div class="search-wrap"><input id="searchInput" type="search" placeholder="Поиск" autocomplete="off" /></div>
      </header>
      <div class="chat-list" id="chatList"></div>
    </aside>
    <main class="chat-pane" id="chatPane">
      <div class="empty-state" id="emptyState">
        <h1>Радар</h1>
        <p id="emptyHint">Закрытые чаты и эфир.</p>
      </div>
      <section class="conversation hidden" id="conversation">
        <header class="conv-header">
          <button class="icon-btn back-btn" id="backBtn"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
          <div class="conv-peer" id="convPeer">
            <div class="avatar sm" id="convAvatar"></div>
            <div><div class="conv-name" id="convName"></div><div class="conv-status" id="convStatus"></div></div>
          </div>
          <div class="conv-actions"><button class="icon-btn" id="moreBtn"></button></div>
        </header>
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <button type="button" class="icon-btn" id="attachBtn"></button>
          <textarea id="msgInput" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
          <button type="button" class="icon-btn" id="emojiBtn"></button>
          <button type="submit" class="send-btn" id="sendBtn"></button>
        </form>
        <div class="emoji-panel hidden" id="emojiPanel"></div>
        <div class="ptt-wrap">
          <div class="ptt-status" id="pttStatus">Рация</div>
          <button type="button" class="ptt-btn" id="pttBtn">PTT</button>
        </div>
      </section>
    </main>
  </div>
  <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
  <nav class="drawer hidden" id="drawer">
    <div class="drawer-profile"><div class="avatar lg" style="background:#6b8afd">R</div><div><div class="drawer-name">Радар</div><div class="drawer-phone">мессенджер</div></div></div>
    <button class="drawer-item" data-action="routes">Маршруты</button>
    <button class="drawer-item" data-action="rights">Права доступа</button>
    <button class="drawer-item" data-action="guest">Гражданский чат</button>
    <button class="drawer-item" data-action="work">Служебный вход</button>
    <button class="drawer-item" data-action="rooms">Мои комнаты</button>
    <button class="drawer-item" data-action="new">Новая комната</button>
    <button class="drawer-item" data-action="theme">Тема</button>
    <button class="drawer-item" data-action="reset">Очистить</button>
  </nav>
  <div class="routes-panel hidden" id="routesPanel">
    <header class="routes-bar"><button type="button" class="icon-btn" id="routesBack">←</button><div class="routes-title">Маршрут</div></header>
    <iframe id="routesFrame" src="about:blank"></iframe>
  </div>
  <div class="gate" id="roleGate">
    <div class="gate-card">
      <h2>Радар</h2>
      <p>Закрытый мессенджер</p>
      <button type="button" id="roleGuest">Я пользователь</button>
      <button type="button" class="ghost" id="roleWork">Служебный вход</button>
    </div>
  </div>
  <div class="gate hidden" id="gate">
    <div class="gate-card">
      <h2>Комната</h2>
      <label>Код смены</label>
      <input id="gatePin" type="password" maxlength="32" style="display:none" />
      <label>Имя</label>
      <input id="gateNick" maxlength="32" />
      <select id="gateFio" style="display:none;width:100%;background:var(--bg);border:1px solid transparent;border-radius:10px;color:var(--text);padding:10px 12px;font:inherit"></select>
      <label>Код</label>
      <input id="gateRoom" maxlength="64" placeholder="friends или smena" />
      <label>Пароль</label>
      <input id="gatePass" type="password" maxlength="128" />
      <button type="button" id="gateJoin">Войти</button>
      <button type="button" class="ghost" id="gateSaved">Быстрый вход</button>
      <button type="button" class="ghost" id="gateSkip">Позже</button>
    </div>
  </div>
  <input id="filePick" type="file" accept="image/*,video/*,audio/*" hidden />
  <div class="gate hidden" id="rightsPanel">
    <div class="gate-card">
      <h2>Права доступа</h2>
      <p id="rightsBody" style="white-space:pre-wrap;text-align:left"></p>
      <button type="button" id="rightsClose">Закрыть</button>
    </div>
  </div>
  <script src="forge.min.js"></script>
  <script src="ngp.js"></script>
  <script src="crypto-live.js"></script>
  <script src="app.js"></script>
  <script src="demo-off.js"></script>
  <script src="role-boot.js"></script>
  <script src="gate-save.js"></script>
  <script src="ptt.js"></script>
  <script src="media.js"></script>
  <script src="staff-desk.js"></script>
  <script src="access.js"></script>
  <script src="live-ui.js"></script>
</body>
</html>
