<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexGram</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%232AABEE'/%3E%3Cpath d='M46 18L16 31.2c-2.1.8-2 2.1-.4 2.6l7.7 2.4 17.8-11.2c.8-.5 1.6-.2.9.3L26.7 38.4l-.3 8.3c.5 0 .7-.2 1-.5l4.6-4.5 9.6 7.1c1.8 1 3 .5 3.5-1.6L48.4 20c.6-2.4-.9-3.5-2.4-2z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <button class="icon-btn" id="menuBtn" title="Меню" aria-label="Меню">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
        </button>
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input id="searchInput" type="search" placeholder="Поиск" autocomplete="off" />
        </div>
      </header>
      <div class="chat-list" id="chatList"></div>
    </aside>
    <main class="chat-pane" id="chatPane">
      <div class="empty-state" id="emptyState">
        <div class="empty-logo">
          <svg viewBox="0 0 64 64" width="88" height="88">
            <circle cx="32" cy="32" r="32" fill="#2AABEE"/>
            <path d="M46 18L16 31.2c-2.1.8-2 2.1-.4 2.6l7.7 2.4 17.8-11.2c.8-.5 1.6-.2.9.3L26.7 38.4l-.3 8.3c.5 0 .7-.2 1-.5l4.6-4.5 9.6 7.1c1.8 1 3 .5 3.5-1.6L48.4 20c.6-2.4-.9-3.5-2.4-2z" fill="#fff"/>
          </svg>
        </div>
        <h1>NexGram</h1>
        <p>Выберите чат слева, чтобы начать переписку.<br>Сообщения хранятся в этом браузере.</p>
      </div>
      <section class="conversation hidden" id="conversation">
        <header class="conv-header">
          <button class="icon-btn back-btn" id="backBtn" aria-label="Назад">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </button>
          <div class="conv-peer" id="convPeer">
            <div class="avatar sm" id="convAvatar"></div>
            <div>
              <div class="conv-name" id="convName"></div>
              <div class="conv-status" id="convStatus"></div>
            </div>
          </div>
          <div class="conv-actions">
            <button class="icon-btn" title="Поиск в чате">
              <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="icon-btn" id="moreBtn" title="Ещё">
              <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
          </div>
        </header>
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <button type="button" class="icon-btn" id="attachBtn" title="Вложение">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 015 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 005 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
          </button>
          <textarea id="msgInput" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
          <button type="button" class="icon-btn" id="emojiBtn" title="Эмодзи">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
          </button>
          <button type="submit" class="send-btn" id="sendBtn" title="Отправить">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
        <div class="emoji-panel hidden" id="emojiPanel"></div>
      </section>
    </main>
  </div>
  <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
  <nav class="drawer hidden" id="drawer">
    <div class="drawer-profile">
      <div class="avatar lg" style="background:#6b8afd">НС</div>
      <div>
        <div class="drawer-name">Николай Савин</div>
        <div class="drawer-phone">+44 • NexGram</div>
      </div>
    </div>
    <button class="drawer-item" data-action="saved">Избранное</button>
    <button class="drawer-item" data-action="new">Новый чат</button>
    <button class="drawer-item" data-action="theme">Светлая / тёмная тема</button>
    <button class="drawer-item" data-action="reset">Сбросить демо-данные</button>
    <div class="drawer-footer">NexGram · прототип мессенджера<br>в духе Telegram</div>
  </nav>
  <script src="app.js"></script>
</body>
</html>
