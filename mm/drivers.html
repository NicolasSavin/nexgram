<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Водители</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="users.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#eef3f8;background:#071018}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(1000px 500px at 0% 0%,#1c4f7a,transparent 55%),radial-gradient(800px 400px at 100% 0%,#7a4a18,transparent 50%),#071018}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:22px 16px 80px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.nav a,.btn{color:#f3e0b8;background:rgba(255,255,255,.06);border:1px solid rgba(243,224,184,.18);border-radius:999px;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}
h1{margin:0 0 6px;font-size:32px}.lead{color:#b7c6d6;margin:0 0 12px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px 16px;margin-top:10px}
.who{font-size:18px;font-weight:800}
.sub{color:#d4b483;font-size:13px;letter-spacing:.04em;margin-top:2px}
.phone{margin:6px 0 10px;font-size:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts a{color:#1a1206;background:linear-gradient(180deg,#f6e2b4,#c8943c);border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:700}
input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#0b1624;color:#fff;font:inherit;margin-top:8px}
.err{color:#f3b4b4}
</style>
</head>
<body>
<div class="bg"></div>
<div id="gate" class="wrap">
<div class="card" style="max-width:420px;margin:40px auto">
<h1 style="font-size:28px">Вход</h1>
<p class="lead">Список только для сотрудников.</p>
<input id="login" placeholder="Фамилия" autocomplete="username">
<input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
<p class="err" id="err"></p>
<button class="btn" type="button" style="margin-top:14px" onclick="enter()">Войти</button>
</div>
</div>
<div id="app" class="wrap" style="display:none">
<div class="nav">
<a href="index.html">Маршруты</a>
<a href="hotels.html">Гостиницы</a>
<span class="nav-lab">Для работников</span>
<a href="where.html">Кто где</a>
<a href="team.html">Чат работников</a>
<a href="naryad.html">Наряд</a>
<a href="drivers.html">Водители</a>
<button class="btn" type="button" onclick="out()">Выйти</button>
</div>
<h1>Водители</h1>
<p class="lead">Водители и секционщики. Список на сервере: поменяли здесь — у всех обновилось, новый APK не нужен.</p>
<div id="list"></div>
<div class="card">
<b id="formTitle">Добавить</b>
<input id="nm" placeholder="Имя">
<input id="car" placeholder="Машина или «секционщик»">
<input id="ph" placeholder="Телефон" inputmode="tel">
<button class="btn" type="button" style="margin-top:12px" onclick="savePerson()">Сохранить</button>
<p class="err" id="formErr"></p>
</div>
</div>
<script>
var KEY="mm_user", editId="";
var BASES=["https://photography-word-essence-knowledge.trycloudflare.com","http://186.246.3.44",""];
function norm(s){return String(s||"").trim().toLowerCase().replace(/ё/g,"е");}
function user(){
  try{
    var h=(location.hash||"").replace(/^#/,"");
    if(h.indexOf("mm=")==0){
      var u=JSON.parse(decodeURIComponent(h.slice(3)));
      if(u&&u.login){ localStorage.setItem(KEY, JSON.stringify(u)); return u; }
    }
  }catch(e){}
  try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}
}
function enter(){
  var l=norm(document.getElementById("login").value), p=String(document.getElementById("pass").value||"").trim();
  var u=(window.HOTEL_USERS||[]).find(function(x){return norm(x.login)===l && String(x.pass)===p;});
  if(!u){document.getElementById("err").textContent="Неверная фамилия или пароль"; return;}
  localStorage.setItem(KEY, JSON.stringify({login:u.login, admin:!!u.admin, name:u.name||u.login}));
  show();
}
function out(){ localStorage.removeItem(KEY); location.href="drivers.html"; }
function plus7(p){
  var d=String(p||"").replace(/\D/g,"");
  if(d.length===11 && d.charAt(0)==="8") return "+7"+d.slice(1);
  if(d.length===11 && d.charAt(0)==="7") return "+"+d;
  return d;
}
function api(opts){
  var i=0;
  function one(){
    if(i>=BASES.length) return Promise.reject(new Error("drivers"));
    var base=BASES[i++];
    var ctrl=typeof AbortController!=="undefined"?new AbortController():null;
    var t=ctrl?setTimeout(function(){ try{ctrl.abort();}catch(e){} }, 8000):null;
    var o=Object.assign({cache:"no-store"}, opts||{});
    if(ctrl) o.signal=ctrl.signal;
    return fetch(base+"/drivers", o).then(function(r){
      if(t) clearTimeout(t);
      if(!r.ok) throw new Error("bad");
      return r.json();
    }).catch(function(){ if(t) clearTimeout(t); return one(); });
  }
  return one();
}
function draw(people){
  document.getElementById("list").innerHTML=(people||[]).map(function(p){
    var tel=plus7(p.phone);
    var sub=p.car || p.role || "";
    return "<div class='card'><div class='who'>"+p.name+"</div>"
      +(sub?"<div class='sub'>"+sub+"</div>":"")
      +"<div class='phone'>"+p.phone+"</div>"
      +"<div class='acts'><a href='tel:"+tel+"'>Позвонить</a><a href='sms:"+tel+"'>SMS</a>"
      +"<button class='btn' type='button' onclick='editPerson("+JSON.stringify(p.id)+")'>Изменить</button>"
      +"<button class='btn' type='button' onclick='delPerson("+JSON.stringify(p.id)+")'>Удалить</button></div></div>";
  }).join("") || "<p class='lead'>Список пуст.</p>";
  window._people=people||[];
}
async function load(){
  try{
    var j=await api();
    draw(j.people||[]);
  }catch(e){
    document.getElementById("list").innerHTML="<p class='lead'>Нет связи со списком. Проверьте интернет и откройте страницу снова.</p>";
  }
}
function editPerson(id){
  var p=(window._people||[]).find(function(x){return x.id===id;});
  if(!p) return;
  editId=id;
  document.getElementById("nm").value=p.name||"";
  document.getElementById("car").value=p.car||p.role||"";
  document.getElementById("ph").value=p.phone||"";
  document.getElementById("formTitle").textContent="Изменить";
}
async function savePerson(){
  var name=document.getElementById("nm").value.trim();
  var car=document.getElementById("car").value.trim();
  var phone=document.getElementById("ph").value.trim();
  var err=document.getElementById("formErr");
  if(!name||!phone){ err.textContent="Нужны имя и телефон."; return; }
  var role=!car || /секцион/i.test(car) ? (car||"секционщик") : "";
  var carName=/секцион/i.test(car) ? "" : car;
  var body={action:editId?"edit":"add", id:editId, name:name, car:carName, phone:phone, role:role};
  try{
    var j=await api({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    editId="";
    document.getElementById("nm").value="";
    document.getElementById("car").value="";
    document.getElementById("ph").value="";
    document.getElementById("formTitle").textContent="Добавить";
    err.textContent="Сохранено. У остальных появится само.";
    draw(j.people||[]);
  }catch(e){ err.textContent="Не сохранилось."; }
}
async function delPerson(id){
  if(!confirm("Удалить из списка?")) return;
  try{
    var j=await api({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"del",id:id})});
    draw(j.people||[]);
  }catch(e){ alert("Не удалилось"); }
}
function show(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  load();
}
if(user()) show();
</script>
<script src="staff-nav.js"></script>
</body>
</html>
