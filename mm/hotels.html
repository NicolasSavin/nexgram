<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Гостиницы · Радар</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="users.js"></script>
<script src="hotels.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#e8eef4;background:#0a1219;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.nav a,.btn{color:#e8eef4;background:#162230;border:1px solid #2a3a4d;border-radius:8px;padding:8px 14px;text-decoration:none;font:inherit;cursor:pointer;font-size:14px}
.nav a:hover,.btn:hover{background:#1e2d3f}
h1{margin:0 0 6px;font-size:28px;font-weight:700}
p.lead{color:#9ab0c4;margin:0 0 16px;font-size:14px}
.card{background:#121c28;border:1px solid #243244;border-radius:12px;padding:14px;margin-bottom:14px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a3a4d;background:#0d1620;color:#fff;font:inherit;margin-top:4px}
.filters{display:grid;grid-template-columns:1fr 240px;gap:12px}
@media(max-width:700px){.filters{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8aa0b4;padding:10px 12px;background:#0f1822}
td{padding:10px 12px;border-top:1px solid #243244;vertical-align:middle}
.price{text-align:right;font-weight:600;color:#d4b483}
.name{display:block;width:100%;text-align:left;color:#e8eef4;cursor:pointer;background:none;border:0;font:inherit;padding:6px 0;font-weight:500}
.name:hover{color:#7ec8ff}
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}
.sheet{width:min(640px,100%);max-height:92vh;overflow:auto;background:#121c28;border:1px solid #243244;border-radius:12px}
.sheet img{width:100%;height:180px;object-fit:cover;display:block;background:#1a2636}
.pad{padding:16px}.pad h2{margin:0 0 8px;font-size:20px}
.meta{color:#9ab0c4;margin:4px 0;font-size:14px}
.phones a{color:#7ec8ff;text-decoration:none}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.box{padding:10px;border-radius:8px;background:#0f1822;border:1px solid #243244}
.box b{display:block;color:#8aa0b4;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.box span{font-size:18px;font-weight:600;color:#d4b483}
#gate{min-height:70vh;display:flex;align-items:center}
.err{color:#f3b4b4;margin-top:8px;font-size:14px}
label.l{display:block;font-size:12px;color:#8aa0b4;margin-top:10px;font-weight:500}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.extra-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:6px;align-items:end}
@media(max-width:560px){.extra-row{grid-template-columns:1fr}}
.custom-fields{margin-top:10px}
.field-line{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #243244;font-size:14px}
.field-line b{color:#8aa0b4;font-weight:500}
</style>
</head>
<body>
<div id="gate" class="wrap">
<div class="card" style="max-width:400px;margin:40px auto;width:100%">
<h1 style="font-size:22px">Вход</h1>
<p class="lead">Логин — фамилия. Пароль — дата рождения (8 цифр).</p>
<label class="l">Логин</label><input id="login" autocomplete="username">
<label class="l">Пароль</label><input id="pass" type="password" autocomplete="current-password">
<p class="err" id="err"></p>
<button class="btn" type="button" style="margin-top:12px" onclick="enter()">Войти</button>
</div>
</div>
<div id="app" class="wrap" style="display:none">
<div class="nav">
<a href="index.html">Маршруты</a>
<a href="hotels.html">Гостиницы</a>
<a href="where.html">Кто где</a>
<a href="team.html">Чат работников</a>
<a href="naryad.html">Наряд</a>
<span id="who" style="margin-left:auto;font-size:13px;color:#9ab0c4"></span>
<button class="btn" type="button" id="addBtn" style="display:none" onclick="editHotel(-1)">Добавить</button>
<button class="btn" type="button" onclick="window.print()">Печать</button>
<button class="btn" type="button" onclick="out()">Выйти</button>
</div>
<h1>Гостиницы</h1>
<p class="lead">Справочник объектов. Нажмите на название для карточки.</p>
<p class="lead" id="hereLine" style="margin:0 0 12px"><a href="where.html" style="color:#7ec8ff">Кто где сегодня</a></p>
<div class="card"><div class="filters">
<div><label class="l" style="margin-top:0">Поиск</label><input id="q" placeholder="Название или адрес"></div>
<div><label class="l" style="margin-top:0">Город</label><select id="city"><option value="">Все города</option></select></div>
</div></div>
<div class="card" style="padding:0;overflow:auto">
<table><thead><tr><th>Название</th><th>Город</th><th>Адрес</th><th class="price">Отчёт, ₽</th><th></th></tr></thead><tbody id="tb"></tbody></table>
</div>
</div>

<div class="modal" id="m" onclick="if(event.target===this && Date.now()-(window._openedAt||0)>600)this.classList.remove('show')">
<div class="sheet">
<img id="hp" alt="">
<div class="pad">
<h2 id="hn"></h2>
<p class="meta" id="hc"></p>
<p class="meta" id="ha"></p>
<div class="meta phones" id="ht"></div>
<div class="custom-fields" id="hfields"></div>
<p class="meta" id="hereIn"></p>
<div class="prices">
<div class="box"><b>В отчёт</b><span id="hrep"></span></div>
<div class="box"><b>Проживание</b><span id="hstay"></span></div>
</div>
<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
<button class="btn" type="button" onclick="imHere()">Я здесь сегодня</button>
<button class="btn" type="button" onclick="document.getElementById('m').classList.remove('show')">Закрыть</button>
<button class="btn" type="button" id="editOpen" style="display:none">Править</button>
</div>
</div></div></div>

<div class="modal" id="ed" onclick="if(event.target===this)this.classList.remove('show')">
<div class="sheet"><div class="pad">
<h2 id="edTitle">Гостиница</h2>
<label class="l">Название</label><input id="en">
<label class="l">Город</label><input id="ec">
<label class="l">Адрес</label><input id="ea">
<label class="l">Основной телефон</label><input id="et">
<div id="extraPhones"></div>
<button class="btn" type="button" style="margin-top:8px" onclick="addPhoneRow()">+ ещё телефон</button>
<label class="l">Цена в отчёт</label><input id="ep" type="number">
<label class="l">Цена проживания</label><input id="es" type="number">
<label class="l">Фото (URL)</label><input id="ei">
<div id="customFields"></div>
<button class="btn" type="button" style="margin-top:8px" onclick="addCustomRow()">+ поле</button>
<div style="margin-top:14px;display:flex;gap:8px">
<button class="btn" type="button" onclick="saveHotel()">Сохранить</button>
<button class="btn" type="button" onclick="document.getElementById('ed').classList.remove('show')">Отмена</button>
</div>
</div></div></div>

<script src="hotels-app.js?v=7"></script>
<script src="staff-nav.js"></script>
<script src="team.js?v=3"></script>
</body>
</html>
