<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#17212b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <title>Радар</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <button class="icon-btn" id="menuBtn" title="Меню" aria-label="Меню">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
        </button>
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Поиск" autocomplete="off" />
        </div>
      </header>
      <div class="chat-list" id="chatList"></div>
    </aside>
    <main class="chat-pane" id="chatPane">
      <div class="empty-state" id="emptyState">
        <h1>Радар</h1>
        <p>Комнаты смены и дома. Демо-чатов нет.</p>
      </div>
      <section class="conversation hidden" id="conversation">
        <header class="conv-header">
          <button class="icon-btn back-btn" id="backBtn" aria-label="Назад"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
          <div class="conv-peer" id="convPeer">
            <div class="avatar sm" id="convAvatar"></div>
            <div>
              <div class="conv-name" id="convName"></div>
              <div class="conv-status" id="convStatus"></div>
            </div>
          </div>
          <div class="conv-actions">
            <button class="icon-btn" id="moreBtn" title="Ещё"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
          </div>
        </header>
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <button type="button" class="icon-btn" id="attachBtn" title="Вложение"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 015 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 005 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
          <textarea id="msgInput" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
          <button type="button" class="icon-btn" id="emojiBtn" title="Эмодзи"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg></button>
          <button type="submit" class="send-btn" id="sendBtn" title="Отправить"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        </form>
        <div class="emoji-panel hidden" id="emojiPanel"></div>
        <div class="ptt-wrap">
          <div class="ptt-status" id="pttStatus">Рация · зажмите и говорите</div>
          <button type="button" class="ptt-btn" id="pttBtn" aria-label="Рация"><span class="ptt-mic">🎤</span><span class="ptt-label">PTT</span></button>
        </div>
      </section>
    </main>
  </div>
  <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
  <nav class="drawer hidden" id="drawer">
    <div class="drawer-profile">
      <div class="avatar lg" style="background:#6b8afd">НС</div>
      <div>
        <div class="drawer-name">Николай Савин</div>
        <div class="drawer-phone">karavanmessage.ru</div>
      </div>
    </div>
    <button class="drawer-item" data-action="routes">Маршруты</button>
    <button class="drawer-item" data-action="new">Новая комната</button>
    <button class="drawer-item" data-action="theme">Тема</button>
    <button class="drawer-item" data-action="reset">Очистить комнаты</button>
    <div class="drawer-footer">Радар · без демо</div>
  </nav>
  <div class="routes-panel hidden" id="routesPanel">
    <header class="routes-bar">
      <button type="button" class="icon-btn" id="routesBack">←</button>
      <div class="routes-title">Маршрут</div>
    </header>
    <iframe id="routesFrame" title="Маршрут" src="about:blank" allow="geolocation"></iframe>
  </div>
  <div class="gate" id="gate">
    <div class="gate-card">
      <h2>Защищённая комната</h2>
      <label>Ваше имя</label>
      <input id="gateNick" maxlength="32" placeholder="Николай" />
      <label>Код комнаты</label>
      <input id="gateRoom" maxlength="64" placeholder="smena или dom" />
      <label>Пароль комнаты</label>
      <input id="gatePass" type="password" maxlength="128" />
      <button type="button" id="gateJoin">Войти в комнату</button>
      <button type="button" class="ghost" id="gateSaved">Войти в сохранённую смену</button>
      <button type="button" class="ghost" id="gateSkip">Позже</button>
    </div>
  </div>
  <script src="ngp.js"></script>
  <script src="crypto-live.js"></script>
  <script src="app.js"></script>
  <script src="demo-off.js"></script>
  <script src="ptt.js"></script>
</body>
</html>
